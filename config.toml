# TOML for 10XSegEval
[owner]
name = 'Normann-BPh'


[preprocessing]
# layers user is interested in
planes = [5, 6, 7]
# number of expected sections
n_roi = 12
# additional space around the roi
buffer = 0.01
# number of chunks a section is spli t into for faster processing
# must be 4,9,16,25,...
chunks = 4
# overlap of chunks
overlap = 0.05


[ImageStats]
# stats of the morphology.ome.tif
pixelsize_xy = 0.2125
pixelsize_z = 3.0000


[paths]
# directory the processed data will be saved to; if undefined: uses git-clone location
home = '/data/cephfs-2/unmirrored/groups/sawitzki/Juno'
# directory of Xenium-results
data_path = '/data/cephfs-2/unmirrored/groups/sawitzki/Juno/data/output-XETG00046__0022391__Region_1__20240426__111610'
# give a name to the sample
sample_name = 'TMA3'
# path to ground_truth
ground_truth = '/data/cephfs-1/work/groups/sawitzki/users/juno12_c/segmentation/labels/13-membrane-reordered-overlap_labels.tif'
# path to micromamba or equivalent - relative to home
mm_path = "/work/micromamba/envs"


[methods.cellvit]

[methods.cpsam]

[methods.dissect]
platform = 'Xenium'
# config_file = 
# weights_file = 
alpha = 0.5
expand_by = 5
gene = True
#random_seed = No predefined seed
num_proprosal = 1200
isslice = false
# x0 = origin if isslice is true
# y0 = origin if isslice is true
# length = length (x-axis) of slice if isslice is true
# width = width (y-axis) of slice if isslice is true

[methods.mesmer]
token = 'TXYsz750.lLuDd8hLaILIBvFVlOolc5KXs4I36pJv'

[methods.proseg]

[methods.stardist]

[methods.ucs]
# check_gene_map = false


[evaluation]
# if a evaluation should be performed based on
# Jaccard and related scores
JACCARD = false
# Jaccard but by cs-benchmark
CS-BENCH = false
# principal components
PCA = true
# probability density
PD = false
overlay_image = false