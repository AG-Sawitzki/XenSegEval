# TOML for XenSegEval
[owner]
name = 'Normann-BPh'
mail = 'philomina-lillie.normann@bih-charite.de'

[tasks]
preprocess = true
segment = false
skip_prepare = true
evaluate = false
plot = true


[paths]
# directory the processed data will be saved to
# as default this will be the cloned directory
home = '/data/cephfs-2/unmirrored/groups/sawitzki/Juno'
# directory of Xenium-results
data_path = '/data/cephfs-2/unmirrored/groups/sawitzki/Juno/data/output-XETG00046__0022430__Region_1__20240704__134614'
# give a name to the sample
sample_name = 'TMA2'
# path to ground_truth
# gt_path = '/data/cephfs-2/unmirrored/groups/sawitzki/Juno/labels/TMA2_13-3_whole-cell_labels.tif'
# path to the user-defined section;
# at least one must have the same coordinates
# as the gt-masks
# sections_path = 'gt_section.json'
# gt_name = 'newmem'


[ImageStats]
# stats of the morphology.ome.tif
# micrometer per pixel
pixelsize_xy = 0.2125
pixelsize_z = 3.0000
# resolution
y = 64612
x = 51096

[sbatch]
# sbatch job specifications
gpu = 'gpu:1'
# time in days
time = 2
# RAM in gigabyte
mem = 64
# nr. cores
cpu = 20


[preprocessing]
# layers user is interested in
# leave list empty if only
# multi-layer required
planes = [5, 6, 7]
# number of expected sections
n_roi = 12
# additional space around the roi
buffer = 0.01
# number of chunks a section is 
# split into for faster processing
# set to zero for None
# must be 0,4,9,16,25,...
chunks = 4
# overlap of chunks in percent
overlap = 0.05


[methods.cpsam]
# style of segmentation.
# Either: '3D' for multi_layer input
# or 'focus' for morphology_focus input.
style = 'focus'

[methods.cpsam.model]
# consult cellpose/models.py#L104 for description of parameters
gpu = true
# available models: cpdino, cpsam_v2, cpdino-vitb, cpsam
pretrained_model = 'cpsam_v2'
# model_type = not used in v4.0.1+
# diam_mean = unknown, not used in v4.0.1+
device = 'cuda:0'
use_bfloat16 = true

[methods.cpsam.eval]
# consult cellpose/models.py#L163 for description of parameters
batch_size = 64
resample = true
# channel_axis = morphology has only one channel; ZYX
z_axis = 0
# rescale = original size is prefered
# diameter = diameter unknown; original size is prefered
# flow_threshold = 0.4; not used for 3D
cellprob_threshold = 0.0
do_3D = true
flow3D_smooth = 0
# anisotropy = turned off by default
stitch_threshold = 0.0
min_size = 15
max_size_fraction = 0.4
# niter = defaults to None
augment = false
tile_overlap = 0.1
# bsize = defaults to None
# interp = not available for 3D
compute_masks = true
# progress = # requires pyqt bar, which opens in external window
[methods.cpsam.eval.normalize]
norm3D = true


[methods.dinocell]
# style of segmentation.
# Either: '3D' for multi_layer input
# or 'focus' for morphology_focus input.
style = 'focus'
#
# If installed via PyPi the algorthim 
# has no parameters to easily define.
# one could rewrite the main.py file in 
# .pixi/envs/dinocell/lib/python3.14/site-packages/dinocell/
# in line 17.


[methods.dissect]
# additionally to the parameters below
# dissect has a config file
## see the "getting started" instructions in 
## README for it's origins and location
#
# consult dissect/segmentation.py#L28 for context
platform = 'xenium'
# config_file = 
# weights_file = 
alpha = 0.5
expand_by = 5
gene = true
#random_seed = No predefined seed
n_jobs = 20
#num_proprosal = # none
#sample_step = #none
#renewal_thres = #none
isslice = false
# x0 = origin if isslice is true
# y0 = origin if isslice is true
# length = length (x-axis) of slice if isslice is true
# width = width (y-axis) of slice if isslice is true
threshold = -0.20
minarea = 1200
maxarea = 4000
#fov = none
stride = 128
ratio_stride = 3
neighbor = 8


[methods.mesmer]
# consult deepcell/applications/mesmer.py#L210
batch_size = 4
# preprocess_kwargs = {}
compartment = 'whole-cell'
pad_mode = 'constant'
# preprocess_kwargs_whole_cell = {}
# preprocess_kwargs_nuclear = {}
# --------------------------------------
# please use your own.
token = 'TXYsz750.lLuDd8hLaILIBvFVlOolc5KXs4I36pJv'


[methods.proseg.general]
# --------------------------------------
# general options
# --------------------------------------
# consult https://github.com/dcjones/proseg#general-arguments
# or run `proseg --help` in the terminal after installing
# set to 0 to use all cores available
nthreads = 0
# set by the pipeline. best left empty.
output-spatialdata = ''
overwrite = true
# 'planes' -> equivalent to length of preprocessing.planes
# or if expected set to an integer(!).
voxel-layers = 'planes'
samples = 200
burnin-samples = 200
# set by the pipeline. best left empty.
voxel-size = ''
# set by the pipeline. best left empty.
burnin-voxel-size = ''

[methods.proseg.output]
# --------------------------------------
# advanced options
# --------------------------------------
# consult /proseg#output-arguments
# leave `path` empty for automatic path-construction.
path = ''
counts = true
expected-counts = false
rates = false
cell-metadata = false
transcript-metadata = false
gene-metadata = false
metagene-rates = false
metagene-loadings = false
voxel-counts = false
# -------------------
cell-polygons = true
union-cell-polygons = false
cell-polygon-layers = true
# --------------------------------------
[methods.proseg.model]
# consult /proseg#model-arguments
min-qv = 0
cells-per-chunk = 100
ncomponents = 10
nhidden = 200
hillclimb = 50
recorded-samples = 100
cell-compactness = 0.04
morphology-steps-per-iter = 4000
nuclear-reassignment-prob = 0.2
prior-seg-reassignment-prob = 0.5
prior-weight = 1
coordinate-scale = 1
quad-size = 150
max-transcript-nucleus-distance = 60
burnin-dispersion = 1
ab-nihlo-bubble-prob = 0.05
monitor-cell-polygons-freq = 10
nunfactored = 200
hyperparam-e-phi = 1
hyperparam-f-phi = 1
hyperparam-neg-mu-phi = 1
hyperparam-tau-phi = 0.1
density-bandwidth = 0.5
density-bins = 5
# -------------------
ignore-z-coord = false
variable-burnin-dispersion = false
check-consistency = false
exclude-spatialdata-transcripts = false
monitor-cell-polygons = false
enforce-connectivity = false
no-factorization = false
include-neg-ctrls = false
use-scaled-cells = false
# --------------------------------------
[methods.proseg.diffusion]
no-diffusion = false
diffusion-probability = 0.2
diffusion-sigma-near = 1
diffusion-sigma-far = 4
diffusion-sigma-z = 0.1
diffusion-proposal-sigma = 4
diffusion-proposal-sigma-z = 0.2


[methods.segger]
# I/O set by pipeline
save-anndata = true
[methods.segger.node]
node-representation-dim = 128
cells-representation = 'pca'
cells-min-counts = 10
cells-clusters-n-neighbors = 10
cells-clusters-resolution = 2.0
genes-clusters-n-neighbors = 5
genes-clusters-resolution = 2.0
gene-corr-reference-path = ''
gene-missing-strategy = ''

[methods.segger.transcripts]
transcripts-max-k = 5
transcripts-max-dist = 5.0

[methods.segger.prediction]
prediction-mode = ['cell', 'nucleus']
prediction-max-k = 3
prediction-graph-buffer-ratio = 0.05

[methods.segger.tiling]
tiling-margin-training = 20.0
tiling-margin-prediction = 20.0
max-nodes-per-tile = 50000
max-edges-per-batch = 1000000

[methods.segger.model]
n-epochs = 20
n-mid-layers = 2
n-heads = 2
hidden-channels = 64
out-channels = 64
learning-rate = 0.001
use-positional-embeddings = true
normalize-embeddings = true

[methods.segger.loss]
segmentation-loss = 'triplet'
transcripts-margin = 0.3
segmentation-margin = 0.4
transcripts-loss-weight-start = 1.0
transcripts-loss-weight-end = 1.0
cells-loss-weight-start = 1.0
cells-loss-weight-end = 1.0
segmentation-loss-weight-start = 0.0
segmentation-loss-weight-end = 0.5

[methods.segger.export]
output = ['anndata', 'boundaries', 'transcripts']
method = 'delaunay'
chaikin-iterations= 0
include-all-transcripts = true
# min-similarity = 
min-transcripts = 10


[methods.stardist]
# style of segmentation.
# Either: '3D' for multi_layer input
# or 'focus' for morphology_focus input.
style = 'focus'
#
# no specific configuration available.


[methods.xenium]
# no configuration available.

[evaluation]
# if a evaluation should be performed based on
# Jaccard and related scores
[evaluation.jaccard]
use = false

# Jaccard but by deepcell-tools
[evaluation.dc_tools]
use = false

# principal components
[evaluation.pca]
use = false

[evaluation.cross]
use = true
# choose metric
## dc: f1, seg, jaccard, dice, PQ
## u4n: F1, Jaccard
metric = 'F1'
# relevant for 'u4n' metrics
## [0.5,...,0.9]
threshold = 0.65
# if to include the provided ground truth
include_gt = false


[plotting]
cross = true
bars = false
overlay = false

[plotting.colors]
cpsam = '#ffb000'
dinocell = '#fe6100'
dissect = '#dc267f'
mesmer = '#785ef0'
proseg = '#648fff'
segger = '#ba5e3e'
stardist = '#79ab59'
xenium = '#6e006e'

[plotting.cmap]
charite-dunkelblau = '#002552'
charite-blau = '#004d9b'
weiss = '#ffffff'
charite-rapsgeld = '#ffdf43'
charite-mango = '#fab600'
charite-rot = '#e31f2c'