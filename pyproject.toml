[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=79"]

[project]
name = "XenSegEval"
version = "0.1.0"
description = "Segment Xenium output using CellposeSAM, DeepCell, DINOCell, DISSECT, ProSeg, segger, StarDist."
authors = [
    {name = "Normann-BPh", email = "philomina-lillie.normann@bih-charite.de"},
]
keywords = ["cell segmentation", "transcriptomics"]
license = "MIT"
license-file = ["LICEN[CS]E*"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">= 3.7"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]
