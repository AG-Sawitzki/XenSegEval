[xenium_output]:
    data:
        transcripts.csv.gz
        cell_boundaries.parquet
        nucleus_boundaries.parquet
        morphology.ome.tif
        morphology_focus:
            morphology_focus_000{0...3}.ome.tif
[sample]:
    processed:
        [section]:
            boundaries:
                cell_relative.parquet
                nucleus_relative.parquet
            morphology:
                focus:
                    focus.ome.tif
                    quartered:
                        q0{0...chunk}.ome.tif
                multi_layer:
                    morphology.ome.tif
                    quartered:
                        q0{0...chunk}.ome.tif
                single_layer:
                    layer0{0...3}:
                        morphology.tif
                        quatered:
                            q0{0...chunk}.tif
            transcripts:
                relative.csv{.gz}
                relative.parquet
        marked_regions-of-interest.tif
        sections_px.json
    results:
        [method]:
            count_matrix:
                [section].mtx.gz
            evaluation:
                [section]:
                    CS-BENCH.csv
                    false_negatives.csv
                    results.csv
                    split_merges.csv
            outlines:
                [section]:
                    [section].npy
                    quartered:
                        q0{0...chunk}.npy
            output:
                [section]:
                    {output}            
            polygons:
                [section].geojson.gz
    run:
        methods:
            [method]:
                logs:
                    %N_%j.err
                    %N_%j.out
                {parameters.json}

        processing: