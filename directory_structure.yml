[xenium_output]:
    data:
        cell_boundaries.parquet
        morphology.ome.tif
        morphology_focus:
            morphology_focus_000{0..3}.ome.tif
        nucleus_boundaries.parquet
        transcripts.csv.gz
[sample]:
    processed:
        [section]:
            boundaries:
                cell_relative.parquet
                nucleus_relative.parquet
            morphology:
                focus:
                    focus.ome.tif
                    quartered:
                        q0{0..chunks}.ome.tif
                multi_layer:
                    morphology.ome.tif
                    quartered:
                        q0{0..chunks}.ome.tif
                single_layer:
                    layer0{0...3}:
                        morphology.tif
                        quatered:
                            q0{0..chunks}.tif
            transcripts:
                relative.csv{.gz}
                relative.parquet
        marked_regions-of-interest.tif
        sections_px.json
    results:
        [method]:
            # count_matrix:
            #     [section].mtx.gz
            evaluation:
                [section]:
                    {layer/stain}
                        CS-BENCH.csv
                        false_negatives.csv
                        results.csv
                        split_merges.csv
            # outlines:
            #     [section]:
            #         [section].npy
            #         quartered:
            #             q0{0..chunks}.npy
            output:
                [section]:
                    {output}            
            polygons:
                [section].geojson.gz
    run:
        jobs:
            [method].sh
        logs:
            [method]_%N_%j.err
            [method]_%N_%j.out
        methods:
            [method]:
                {parameters.json}